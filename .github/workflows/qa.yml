name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  financial-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run financial core tests
        run: node --test tests/core.test.js
      - name: Static syntax check
        run: |
          node --check core.js
          node --check app.js
          node --check sw.js
